<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>特情配图采集清单</title>
<style>
:root{--cream:#F7F4EC;--navy:#12233B;--accent:#2E93D6;--brass:#A8842F;--alert:#C0392B;--grey:#8A8474}
body{background:var(--cream);color:#222;font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;margin:0 auto;max-width:1100px;padding:0 16px 60px}
.band{background:var(--navy);color:#fff;padding:10px 16px;margin:0 -16px;font-size:13px;letter-spacing:.1em}
h1{color:var(--navy);font-size:22px;margin:18px 0 6px}
.note{background:#fff;border-left:5px solid var(--brass);padding:10px 14px;font-size:14px;line-height:1.8}
.bar{position:sticky;top:0;background:var(--cream);padding:10px 0;z-index:5;border-bottom:1px solid #E9E4D6;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{background:var(--navy);color:#fff;border:0;padding:9px 16px;font-size:14px;border-radius:4px;cursor:pointer}
button.alt{background:var(--brass)}
#st{font-size:13px;color:var(--grey)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.card{background:#fff;border:1px solid #E9E4D6;padding:8px;font-size:12px;line-height:1.5;min-width:0}
.card img{width:100%;height:150px;object-fit:cover;background:#eee}
.card .k{color:var(--brass);font-weight:bold}
.card a{color:var(--accent);word-break:break-all}
.ok{color:#1F8A70}.bad{color:var(--alert)}
</style></head><body>
<div class="band">XIGUANG · 析光特情 · 配图采集清单</div>
<h1>海上岛屿·港口·小岛·远海编组遭袭与防卫案例汇编 —— 配图采集清单</h1>
<div class="note">本页图片全部直接热链 Wikimedia Commons 等原始图源，由您的浏览器加载。<b>用法：</b>点击“一键打包下载”，浏览器会逐张抓取原图并打包为 <code>xiguang_imgs.zip</code>（含 manifest.json 对照表）；下载完成后把该压缩包传回对话，我会把原图嵌入 docx/PDF 版并按图号重排。个别图片如抓取失败（卡片标红），可点开链接手动另存，文件名按卡片上的“保存名”命名后一并打包。</div>
<div class="bar"><button id="go">一键打包下载（24 张）</button><button class="alt" id="txt">下载链接清单 urls.txt</button><span id="st"></span></div>
<div class="grid" id="g"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const ITEMS = [{"case": "岛-01", "desc": "越占大现礁（Discovery Great Reef）卫星影像", "url": "https://upload.wikimedia.org/wikipedia/commons/6/6d/Discovery_Great_Reef,_Spratly_Islands.png", "page": "https://commons.wikimedia.org/wiki/File:Discovery_Great_Reef,_Spratly_Islands.png", "save_as": "vn_spratly_reclamation_2023_2026_1"}, {"case": "岛-01", "desc": "2025年1月柏礁扩建后卫星影像", "url": "https://upload.wikimedia.org/wikipedia/commons/8/86/Barque_Canada_Reef_Jan_2025.png", "page": "https://commons.wikimedia.org/wiki/File:Barque_Canada_Reef_Jan_2025.png", "save_as": "vn_spratly_reclamation_2023_2026_2"}, {"case": "岛-05", "desc": "“肩并肩-2025”美海军陆战队在巴斯科部署NMESIS", "url": "https://upload.wikimedia.org/wikipedia/commons/4/4d/Balikatan_25-_Marines_deploy_NMESIS_to_Basco_(8996664).jpg", "page": "https://commons.wikimedia.org/wiki/File:Balikatan_25-_Marines_deploy_NMESIS_to_Basco_(8996664).jpg", "save_as": "luzon_strait_typhon_nmesis_2024_2026_1"}, {"case": "岛-05", "desc": "“堤丰”MRC在“护身军刀-25”演习中发射SM-6（2025-07-16，澳大利亚）", "url": "https://upload.wikimedia.org/wikipedia/commons/b/b6/Typhon_Mid-Range_Capability_(MRC)_missile_system_firing_SM-6.jpg", "page": "https://commons.wikimedia.org/wiki/File:Typhon_Mid-Range_Capability_(MRC)_missile_system_firing_SM-6.jpg", "save_as": "luzon_strait_typhon_nmesis_2024_2026_2"}, {"case": "岛-09", "desc": "燕子礁（Swallow Reef）示意图", "url": "https://upload.wikimedia.org/wikipedia/commons/1/10/Swallow_Reef,_Spratly_Islands.png", "page": "https://commons.wikimedia.org/wiki/File:Swallow_Reef,_Spratly_Islands.png", "save_as": "scs_layanglayang_radar_2026_1"}, {"case": "岛-09", "desc": "燕子礁影像（裁切）", "url": "https://upload.wikimedia.org/wikipedia/commons/e/e8/Swallow_Reef3_(cropped).jpg", "page": "https://commons.wikimedia.org/wiki/File:Swallow_Reef3_(cropped).jpg", "save_as": "scs_layanglayang_radar_2026_2"}, {"case": "岛-11", "desc": "纳土纳拉奈山", "url": "https://upload.wikimedia.org/wikipedia/commons/4/48/Mount_Ranai_in_Natuna.jpg", "page": "https://commons.wikimedia.org/wiki/File:Mount_Ranai_in_Natuna.jpg", "save_as": "scs_natuna_buildup_2025_1"}, {"case": "港-25", "desc": "新加坡港（PSA）全景，约占全球集装箱转运吞吐量五分之一（文件说明）", "url": "https://upload.wikimedia.org/wikipedia/commons/f/f5/The_port_of_Singapore.jpg", "page": "https://commons.wikimedia.org/wiki/File:The_port_of_Singapore.jpg", "save_as": "mal_sg_strait_robbery_surge_2025_1"}, {"case": "港-25", "desc": "马六甲海峡位置示意图", "url": "https://upload.wikimedia.org/wikipedia/commons/2/2c/LocatorMap_Malacca_Strait.png", "page": "https://commons.wikimedia.org/wiki/File:LocatorMap_Malacca_Strait.png", "save_as": "mal_sg_strait_robbery_surge_2025_2"}, {"case": "礁-03", "desc": "南康暗沙（北康暗沙与南康暗沙）位置示意图", "url": "https://upload.wikimedia.org/wikipedia/commons/7/78/North_and_South_Luconia_Shoals.jpg", "page": "https://commons.wikimedia.org/wiki/File:North_and_South_Luconia_Shoals.jpg", "save_as": "scs_luconia_kasawari_ccg5901_2023_03_1"}, {"case": "礁-03", "desc": "美国国务院2015年地图（裁切）中的南康暗沙", "url": "https://upload.wikimedia.org/wikipedia/commons/7/76/Luconia_Shoals_Department_of_State_map_2016587286_(2015)_(cropped).jpg", "page": "https://commons.wikimedia.org/wiki/File:Luconia_Shoals_Department_of_State_map_2016587286_(2015)_(cropped).jpg", "save_as": "scs_luconia_kasawari_ccg5901_2023_03_2"}, {"case": "礁-04", "desc": "中国海警5901船（菲律宾海岸警卫队拍摄）", "url": "https://upload.wikimedia.org/wikipedia/commons/9/93/CCG_5901_PCG_photo.jpg", "page": "https://commons.wikimedia.org/wiki/File:CCG_5901_PCG_photo.jpg", "save_as": "vanguard_bank_2023_2024_ccg_patrols_1"}, {"case": "礁-04", "desc": "越南渔业监察船KN-490（同类船只示意，非本案涉事船）", "url": "https://upload.wikimedia.org/wikipedia/commons/2/28/Vietnam_Fisheries_Resources_Surveillance's_vessel_KN-490.jpg", "page": "https://commons.wikimedia.org/wiki/File:Vietnam_Fisheries_Resources_Surveillance%27s_vessel_KN-490.jpg", "save_as": "vanguard_bank_2023_2024_ccg_patrols_2"}, {"case": "礁-11", "desc": "中国海警船（DiREx-15演习期间，非南康暗沙现场，仅作舰型示意）", "url": "https://upload.wikimedia.org/wikipedia/commons/d/d8/Chinese_Coast_Guard_ship_during_DiREx-15.jpg", "page": "https://commons.wikimedia.org/wiki/File:Chinese_Coast_Guard_ship_during_DiREx-15.jpg", "save_as": "scs_luconia_ccg_persistent_2024_2"}, {"case": "礁-13", "desc": "中国海警3105号船在黄岩岛附近（本案被菲方点名的船只之一）", "url": "https://upload.wikimedia.org/wikipedia/commons/0/0c/China_Coast_Guard_CCG_3105_near_Scarborough_Shoal_02.02.24.jpg", "page": "https://commons.wikimedia.org/wiki/File:China_Coast_Guard_CCG_3105_near_Scarborough_Shoal_02.02.24.jpg", "save_as": "scarborough_2024_04_30_water_cannon_1"}, {"case": "礁-13", "desc": "黄岩岛Landsat 7卫星影像（经调色）", "url": "https://upload.wikimedia.org/wikipedia/commons/0/03/Scarborough_Shoal_Landsat.jpg", "page": "https://commons.wikimedia.org/wiki/File:Scarborough_Shoal_Landsat.jpg", "save_as": "scarborough_2024_04_30_water_cannon_2"}, {"case": "礁-20", "desc": "西沙群岛玉琢礁（Vuladdore Reef）影像，示意西沙渔场礁盘环境", "url": "https://upload.wikimedia.org/wikipedia/commons/3/38/Vuladdore_Reef,_Paracel_Islands.jpg", "page": "https://commons.wikimedia.org/wiki/File:Vuladdore_Reef,_Paracel_Islands.jpg", "save_as": "paracel_2024_09_29_vn_fishermen_1"}, {"case": "礁-20", "desc": "越南近海木质渔船（通用示意图，非涉事渔船）", "url": "https://upload.wikimedia.org/wikipedia/commons/3/30/Vietnamese_fishing_boat_05.jpg", "page": "https://commons.wikimedia.org/wiki/File:Vietnamese_fishing_boat_05.jpg", "save_as": "paracel_2024_09_29_vn_fishermen_2"}, {"case": "礁-21", "desc": "印尼海事安全局KN Tanjung Datu（1101）巡逻船，2018-03-23（同级船型示意，非本次事件拍摄）", "url": "https://upload.wikimedia.org/wikipedia/commons/b/b2/KN_Tanjung_Datu_(1101),_Indonesian_Maritime_Security_Agency,_23_march_2018.jpg", "page": "https://commons.wikimedia.org/wiki/File:KN_Tanjung_Datu_(1101),_Indonesian_Maritime_Security_Agency,_23_march_2018.jpg", "save_as": "scs_natuna_ccg5402_2024_10_1"}, {"case": "礁-22", "desc": "美国国家地理空间情报局（NGA）黄岩岛海图91004", "url": "https://upload.wikimedia.org/wikipedia/commons/e/e2/Scarborough_Shoal_(South_China_Sea)_NGA_Nautical_Chart_91004.jpg", "page": "https://commons.wikimedia.org/wiki/File:Scarborough_Shoal_(South_China_Sea)_NGA_Nautical_Chart_91004.jpg", "save_as": "scarborough_2024_12_04_sideswipe_1"}, {"case": "礁-25", "desc": "菲律宾科学家在铁线礁沙洲考察", "url": "https://upload.wikimedia.org/wikipedia/commons/f/f3/Filipino_scientists_inspects_feature_Sandy_Cay,_South_China_Sea.jpg", "page": "https://commons.wikimedia.org/wiki/File:Filipino_scientists_inspects_feature_Sandy_Cay,_South_China_Sea.jpg", "save_as": "sandy_cay_2025_04_05_flag_landings_1"}, {"case": "礁-25", "desc": "中业岛及周边礁盘Landsat 7卫星影像，可见铁线礁所在礁坪", "url": "https://upload.wikimedia.org/wikipedia/commons/0/02/Thitu_Island_%26_Reefs,_Spratly_Islands.png", "page": "https://commons.wikimedia.org/wiki/File:Thitu_Island_&_Reefs,_Spratly_Islands.png", "save_as": "sandy_cay_2025_04_05_flag_landings_2"}, {"case": "礁-28", "desc": "马来西亚皇家海军近海巡逻舰KD Kelantan（175）", "url": "https://upload.wikimedia.org/wikipedia/commons/2/21/Royal_Malaysian_Navy_Offshore_Patrol_Vessel_KD_Kelantan_(175).jpg", "page": "https://commons.wikimedia.org/wiki/File:Royal_Malaysian_Navy_Offshore_Patrol_Vessel_KD_Kelantan_(175).jpg", "save_as": "scs_luconia_ccg5304_2025_12_1"}, {"case": "礁-31", "desc": "三描礼士省与黄岩岛相对位置示意图（菲方制图口径）", "url": "https://upload.wikimedia.org/wikipedia/commons/6/6f/Map_of_Zambales_with_Scarborough_shoal.svg", "page": "https://commons.wikimedia.org/wiki/File:Map_of_Zambales_with_Scarborough_shoal.svg", "save_as": "scarborough_2026_07_23_24_water_cannon_1"}];
const g = document.getElementById('g');
ITEMS.forEach((it, i) => {
  const d = document.createElement('div'); d.className = 'card'; d.id = 'c' + i;
  d.innerHTML = `<img loading="lazy" src="${it.url}" onerror="this.style.opacity=.2;document.getElementById('s${i}').innerHTML='<span class=bad>预览失败</span>'">
  <div><span class="k">${it.case}</span> ${it.desc}</div>
  <div>保存名：<code>${it.save_as}</code> <span id="s${i}"></span></div>
  <div><a href="${it.page}" target="_blank">原图页面</a> · <a href="${it.url}" target="_blank">原图直链</a></div>`;
  g.appendChild(d);
});
function extOf(u, type){ if(type && type.includes('png')) return '.png'; if(type && type.includes('webp')) return '.webp'; const m=u.toLowerCase().match(/\.(jpe?g|png|webp|gif|tiff?)(\?|$)/); return m? '.'+m[1].replace('jpeg','jpg'):'.jpg'; }
document.getElementById('txt').onclick = () => {
  const blob = new Blob([ITEMS.map(it => it.save_as + '\t' + it.url).join('\n')], {type:'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'urls.txt'; a.click();
};
async function shrink(blob){
  // 统一压成长边不超过 1600px 的 JPEG（质量 0.82），单张通常 150-400KB
  try{
    const bmp = await createImageBitmap(blob);
    const k = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    const g = c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
  }catch(e){ return null; }
}
function thumbUrl(u){ // upload.wikimedia.org 原图 -> 1280px 缩略图
  const m = u.match(/^(https:\/\/upload\.wikimedia\.org\/wikipedia\/commons\/)([0-9a-f]\/[0-9a-f]{2}\/)(.+)$/);
  if(!m) return null; let n=m[3]; let t=n; if(/\.(svg|tiff?)$/i.test(n)) t=n+'.png';
  return m[1]+'thumb/'+m[2]+n+'/1280px-'+t;
}
async function getBlob(u){
  for (const x of [thumbUrl(u), u]) { if(!x) continue;
    try{ const r=await fetch(x,{mode:'cors'}); if(r.ok) return await r.blob(); }catch(e){} }
  throw new Error('fetch failed');
}
function save(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }
document.getElementById('go').onclick = async () => {
  const LIMIT = 25*1024*1024; // 每卷不超过 25MB
  const st = document.getElementById('st'); let zip = new JSZip(), size = 0, vol = 1, ok = 0, bad = 0; const man = [];
  const flush = async () => { zip.file('manifest_part'+vol+'.json', JSON.stringify(man.filter(m=>m.vol===vol),null,1));
    const b = await zip.generateAsync({type:'blob'}); save(b, 'xiguang_imgs_part'+vol+'.zip'); vol++; zip = new JSZip(); size = 0;
    await new Promise(r=>setTimeout(r,800)); };
  for (let i = 0; i < ITEMS.length; i++) {
    const it = ITEMS[i]; st.textContent = `抓取中 ${i+1}/${ITEMS.length}（成功 ${ok}，失败 ${bad}，第 ${vol} 卷）`;
    try {
      const raw = await getBlob(it.url); const small = (await shrink(raw)) || raw;
      if (size + small.size > LIMIT && size > 0) await flush();
      const name = it.save_as + '.jpg'; zip.file(name, small); size += small.size; ok++;
      man.push({...it, file:name, vol:vol}); document.getElementById('s'+i).innerHTML = '<span class="ok">已打包（第'+vol+'卷）</span>';
    } catch(e) { bad++; man.push({...it, file:null, error:String(e), vol:vol}); document.getElementById('s'+i).innerHTML = '<span class="bad">抓取失败</span>'; }
  }
  await flush();
  st.textContent = `完成：成功 ${ok} 张，失败 ${bad} 张，共 ${vol-1} 卷（每卷不超过 25MB）。请把各卷 zip 依次传回对话。`;
};
</script></body></html>
